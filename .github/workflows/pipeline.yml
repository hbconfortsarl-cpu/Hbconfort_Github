name: Tests automatiques
run-name: ${{ github.actor }} is learning GitHub Actions
on: 
  push:
    branches:
      - main
jobs:
  testing:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
        - run: npm install
        - run: npm test 
        - run: echo "Pipe terminated with success"
